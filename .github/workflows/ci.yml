name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet and test
        run: |
          if [ -z "$(go list ./... 2>/dev/null)" ]; then echo "no Go packages yet"; exit 0; fi
          go vet ./...
          go test -count=1 ./...

  # Interactive TUI driven through node-pty on macOS, the target platform:
  # key and mouse escape sequences as Terminal.app / iTerm2 send them.
  tui-pty:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # End-to-end acceptance and compatibility suite (`npm run test:e2e`) on
  # macOS, the target platform: browser acceptance on Chromium, Firefox and
  # WebKit plus the installed Chrome and Edge, the TUI on node-pty with the
  # Terminal.app and iTerm2 profiles, CLI/API/data checks and the web UI
  # regression suite. Model and agents are the fixed mocks of tests/e2e.
  # The traceability report (reports/e2e) is kept for every run.
  e2e:
    runs-on: macos-latest
    env:
      TODO_E2E_CHANNELS: chrome,msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-acceptance-report
          path: |
            reports/e2e/
            test-results/
